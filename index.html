<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>きのうノート</title>
  <meta name="description" content="夜のあいだに集めた、きのうのニュースの勉強ノート">
  <meta name="theme-color" content="#fff8ef" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#17162a" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="cards.css">
  <link rel="stylesheet" href="insight.css">
  <script>
    try { const saved = localStorage.getItem("theme"); if (saved) document.documentElement.dataset.theme = saved; } catch (error) {}
  </script>
</head>
<body>
  <header class="masthead">
    <div class="masthead-row">
      <a class="brand" href="#/">
        <span class="brand-owl" aria-hidden="true">🦉</span>
        <span class="brand-text"><span class="brand-name">きのうノート</span><span class="brand-sub">夜のうちに集めた、きのうのニュース</span></span>
      </a>
      <div class="masthead-tools">
        <div class="date-nav">
          <button type="button" class="icon-button" id="older" aria-label="前の日">‹</button>
          <select id="date-select" aria-label="日付をえらぶ"></select>
          <button type="button" class="icon-button" id="newer" aria-label="次の日">›</button>
        </div>
        <button type="button" class="icon-button" id="theme-toggle" aria-label="明るさを切り替え">🌗</button>
      </div>
    </div>
    <nav class="tabs" id="tabs" aria-label="ジャンル"></nav>
  </header>
  <main id="page" class="page"><p class="loading">🦉 ノートをひらいています…</p></main>
  <footer class="footer">
    <p>要約・所感は Claude（AI）が元記事をもとに自動で書いています。くわしくは各記事の元記事へ。</p>
    <p>投資の見方は勉強のためのメモで、すすめではありません。</p>
  </footer>
  <div class="popover" id="popover" role="dialog" hidden></div>
  <script type="module" src="app.js"></script>
</body>
</html>
